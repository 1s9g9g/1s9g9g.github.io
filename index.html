<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17121f">
<meta name="color-scheme" content="dark">
<title>Для тебя💕</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@300;400;500;600&display=swap');
:root{color-scheme: dark}
:root{--bg:#17121f;--rose:#d9a7b4;--cream:#f7eee8;--muted:#b9aab7;--line:rgba(255,231,238,.17)}
*{box-sizing:border-box} html{min-height:100%;background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--cream);font-family:Manrope, sans-serif;background:radial-gradient(ellipse at 50% 15%,#493044 0%,#251b2d 38%,#17121f 78%);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:radial-gradient(#fff 0.65px,transparent .65px);background-size:34px 34px;mask-image:linear-gradient(to bottom,black,transparent 85%)}
.center{min-height:100vh;display:grid;place-items:center;padding:28px 18px;position:relative}
.screen{width:min(100%,760px);text-align:center;position:relative;z-index:1}
.eyebrow{font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--rose);margin-bottom:22px}
h1,h2,.serif{font-family:"Cormorant Garamond",serif;font-weight:400}
h1{font-size:clamp(42px,8vw,76px);line-height:.98;margin:0 0 18px}
.intro{color:var(--muted);font-size:13px;letter-spacing:.06em;line-height:1.8}
.envelope-wrap{margin:44px auto 0;width:190px;height:142px;position:relative;cursor:pointer;filter:drop-shadow(0 18px 35px #08060b88);transition:transform .35s}
.envelope-wrap:hover{transform:translateY(-6px) rotate(-1deg)}
.envelope{position:absolute;inset:20px 0 0;background:linear-gradient(145deg,#d8a9b5,#a96f84);border-radius:4px 4px 10px 10px;overflow:hidden}
.envelope:before{content:"";position:absolute;inset:0;background:linear-gradient(32deg,transparent 49.5%,#edc4cc 50%,transparent 50.7%),linear-gradient(-32deg,transparent 49.5%,#e8bac5 50%,transparent 50.7%)}
.flap{position:absolute;top:20px;left:0;width:0;height:0;border-left:95px solid transparent;border-right:95px solid transparent;border-top:75px solid #edc5ce;transform-origin:top;z-index:2;transition:transform .65s ease}
.seal{position:absolute;z-index:3;left:50%;top:75px;transform:translate(-50%,-50%);width:35px;height:35px;border-radius:50%;background:#8d4e68;display:grid;place-items:center;color:#fbe9e8;font-size:17px;box-shadow:0 3px 12px #53283c55}
.tap{margin-top:18px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#e5c4cd}
.opening .flap{transform:rotateX(180deg)}.opening .seal{opacity:0;transition:opacity .2s}
.hidden{display:none!important}
#letter{animation:appear .9s ease both}
@keyframes appear{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.heart{font-size:23px;color:var(--rose);margin:0 0 16px}
.message{max-width:590px;margin:0 auto 42px;color:#eadde0;font-family:"Cormorant Garamond",serif;font-size:clamp(22px,4vw,30px);line-height:1.45;white-space:pre-line}
.counter-label{font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:var(--rose);margin-bottom:20px}
.counter{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:570px;margin:0 auto}
.unit{padding:20px 8px 17px;border:1px solid var(--line);background:linear-gradient(145deg,#ffffff0a,#ffffff03);border-radius:12px;backdrop-filter:blur(8px)}
.num{font-family:"Cormorant Garamond",serif;font-size:clamp(35px,7vw,55px);line-height:1;color:#fff0ef;font-variant-numeric:tabular-nums}
.unit small{display:block;margin-top:9px;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.since{margin-top:26px;color:#a999a8;font-size:11px;letter-spacing:.12em}
.footer{margin-top:52px;color:#897888;font-size:10px;letter-spacing:.18em}
.back{margin-top:30px;background:none;border:0;color:#bca5b1;font:inherit;font-size:11px;letter-spacing:.14em;cursor:pointer;border-bottom:1px solid #806879;padding:7px}
@media(max-width:520px){.counter{gap:6px}.unit{padding:17px 3px}.num{font-size:36px}.unit small{font-size:8px;letter-spacing:.12em}.message{margin-bottom:32px}}
</style>
</head>
<body>
<main class="center">
  <section class="screen" id="welcome">
    <div class="eyebrow">первое письмо для тебя</div>
    <h1>Я хочу кое-что<br>сказать тебе</h1>
    <div class="intro">Открой, когда будешь готова 💖</div>
    <div class="envelope-wrap" id="openLetter" role="button" tabindex="0" aria-label="Открыть письмо">
      <div class="envelope"></div><div class="flap"></div><div class="seal">♡</div>
    </div>
    <div class="tap">нажми на конверт</div>
  </section>

  <section class="screen hidden" id="letter">
    <div class="heart">♾️✦ &nbsp; ❣️ &nbsp; ✦♾️</div>
    <div class="eyebrow">для самого дорогого человека</div>
    <!--<h3>И это только начало</h3>-->
    <p class="message" id="personalMessage"></p>
    <h3>Я люблю тебя<br>💕💓💕</h3>
    <div class="counter-label">мы вместе уже</div>
    <div class="counter">
      <div class="unit"><div class="num" id="days">000</div><small>дней</small></div>
      <div class="unit"><div class="num" id="hours">00</div><small>часов</small></div>
      <div class="unit"><div class="num" id="minutes">00</div><small>минут</small></div>
      <div class="unit"><div class="num" id="seconds">00</div><small>секунд</small></div>
    </div>
    <div class="since" id="sinceText"></div>
    <div class="footer">С КАЖДЫМ ДНЁМ — ЧУТЬ БОЛЬШЕ ♡</div>
    <button class="back" id="back">вернуться к конверту</button>
  </section>
</main>
<script>

//-------------opt
const START_DATE = "2026-10-17T18:00:00";
const PERSONAL_MESSAGE = "Люблю тебя больше всего на свете:\nбезгранично, неимоверно сильно\n💗🩷💗\nЭту дату я запомню на всю жизнь, хотя дело, конечно, не в дате, а в том, что произошло.\nЯ еще не раз расскажу тебе об этом, но сейчас скажу кратко: это был изумительный день, никогда я ещё не был так уверен в чём-то, как тогда. И я так рад, что всё получилось🥰\nЯ сказал, что не жалею о поступлении в лицей, единственная причина — это ты✨\nЯ ни о чём не жалею — каждая ошибка, каждое препятствие в моей жизни вело меня к тебе🤗";

//😇🥰😊☺️🤗😭😞❤️💕💓❣️💗🩷💖♾️❤️‍🩹💘❤️‍🔥👉👈
document.getElementById("personalMessage").textContent = PERSONAL_MESSAGE;
const start = new Date(START_DATE);
document.getElementById("sinceText").textContent =
  "с " + start.toLocaleDateString("ru-RU", {day:"numeric", month:"long", year:"numeric"});
function updateCounter(){
  let diff = Math.max(0, Date.now() - start.getTime());
  const days = Math.floor(diff / 86400000); diff %= 86400000;
  const hours = Math.floor(diff / 3600000); diff %= 3600000;
  const minutes = Math.floor(diff / 60000);
  const seconds = Math.floor((Date.now() - start.getTime()) / 1000) % 60;
  document.getElementById("days").textContent = String(days).padStart(3,"0");
  document.getElementById("hours").textContent = String(hours).padStart(2,"0");
  document.getElementById("minutes").textContent = String(minutes).padStart(2,"0");
  document.getElementById("seconds").textContent = String(seconds).padStart(2,"0");
}
updateCounter(); setInterval(updateCounter,1000);
const envelope = document.getElementById("openLetter");
function openLetter(){
  envelope.classList.add("opening");
  setTimeout(()=>{document.getElementById("welcome").classList.add("hidden");document.getElementById("letter").classList.remove("hidden");},450);
}
envelope.addEventListener("click",openLetter);
envelope.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openLetter();}});
document.getElementById("back").addEventListener("click",()=>{
  document.getElementById("letter").classList.add("hidden");
  document.getElementById("welcome").classList.remove("hidden");
  envelope.classList.remove("opening");
});
</script>
</body>
</html>
